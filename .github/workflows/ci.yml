name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format and lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Startup diagnostics
        if: matrix.os == 'ubuntu-latest'
        run: python3 tests/diagnostics.py

      - name: Local HTTP rules
        if: matrix.os == 'ubuntu-latest'
        run: python3 tests/http_rules.py
      - name: Durable notification outbox with fake Telegram
        if: matrix.os == 'ubuntu-latest'
        run: python3 tests/outbox.py
      - name: Interrupted delivery and storage recovery
        if: matrix.os == 'ubuntu-latest'
        run: python3 tests/outbox_recovery.py
